<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Site & Comunidade</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; line-height: 1.6; }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin-bottom: 20px; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <header>
    <h1>Bem-vindo ao Meu Site!</h1>
    <p><a href="/admin">Acessar Painel de Administração (/admin)</a></p>
  </header>

  <main>
    <h2>Última Postagem</h2>
    
    <!-- Exemplo de Embed do YouTube -->
    <div class="video-container">
      <iframe src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ" title="Vídeo do YouTube" frameborder="0" allowfullscreen></iframe>
    </div>

    <p>Esta é uma postagem de exemplo. Acesse o painel administrativo para criar novas postagens!</p>
  </main>

  <!-- Área de Fórum/Comentários com Giscus -->
  <section style="margin-top: 50px;">
    <h2>Fórum de Discussão</h2>
    <!-- Substitua os dados abaixo com o código gerado em https://giscus.app/pt -->
    <script src="https://giscus.app/client.js"
            data-repo="seu-usuario/seu-repositorio"
            data-repo-id="SEU_REPO_ID_AQUI"
            data-category="General"
            data-category-id="SEU_CATEGORY_ID_AQUI"
            data-mapping="pathname"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="bottom"
            data-theme="preferred_color_scheme"
            data-lang="pt"
            crossorigin="anonymous"
            async>
    </script>
  </section>
</body>
</html>
